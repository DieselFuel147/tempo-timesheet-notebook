name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-bump:
    # Skip runs triggered by the bot's own release commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
      pr_number: ${{ steps.bump.outputs.pr_number }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bump version, tag, and push
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export VERSION

          # Only release on merges of pull requests into main. The
          # commits-associated-with-PR endpoint serves a reduced PR object
          # with no "merged" field, so match on state and then verify the
          # merge against the canonical PR record.
          PR_NUMBER="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.state == "closed")][0].number' || true)"

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "::notice::Push ${GITHUB_SHA} is not an associated pull request; skipping release."
            echo "Skipped: not a merged pull request." >> "$GITHUB_STEP_SUMMARY"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IS_MERGED="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merged')"
          if [ "${IS_MERGED}" != "true" ]; then
            echo "::notice::PR #${PR_NUMBER} was closed without being merged; skipping release."
            echo "Skipped: PR #${PR_NUMBER} closed without merging." >> "$GITHUB_STEP_SUMMARY"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LABELS="$(gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name' || true)"
          if grep -qx 'major' <<<"${LABELS}"; then
            LEVEL=major
            SOURCE='major label'
          elif grep -qx 'minor' <<<"${LABELS}"; then
            LEVEL=minor
            SOURCE='minor label'
          elif grep -qx 'patch' <<<"${LABELS}"; then
            LEVEL=patch
            SOURCE='patch label'
          else
            # No release label set: fall back to the same title inference the
            # "PR release type" bot uses for its preview comment, so what the
            # comment promised is what actually ships.
            PR_TITLE="$(gh pr view "${PR_NUMBER}" --json title --jq '.title')"
            TITLE_LOWER="$(printf '%s' "${PR_TITLE}" | tr '[:upper:]' '[:lower:]')"
            case "${TITLE_LOWER}" in
              *"!"*|*break*)
                LEVEL=major
                INFERENCE='breaking-change marker in the title'
                ;;
              feat*|feature*|add*|allow*|support*|introduce*)
                LEVEL=minor
                INFERENCE='title looks like a feature'
                ;;
              *)
                LEVEL=patch
                INFERENCE='default for fixes, refactors and chores'
                ;;
            esac
            SOURCE="title inference (${INFERENCE})"
          fi
          echo "PR #${PR_NUMBER}: bumping ${LEVEL} (${SOURCE})"

          # Source of truth is package.json; any prerelease suffix is dropped.
          CURRENT="$(node -p 'require("./package.json").version')"
          BASE="${CURRENT%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<<"${BASE}"
          case "${LEVEL}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version ${CURRENT} -> ${VERSION}"

          # package.json + package-lock.json
          npm version "${VERSION}" --no-git-tag-version

          # tauri.conf.json
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          '

          # Cargo.toml ([package] section only)
          awk -v ver="${VERSION}" '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { $0 = "version = \"" ver "\"" }
            { print }
          ' src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
          mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml

          # Keep Cargo.lock in sync with the new crate version.
          (cd src-tauri && cargo update -w)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "refs/tags/v${VERSION}"

          {
            echo "released=true"
            echo "version=${VERSION}"
            echo "pr_number=${PR_NUMBER}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} from PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"

  build-and-release:
    needs: version-bump
    if: needs.version-bump.outputs.released == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.version-bump.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build macOS app bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version-bump.outputs.version }}
          PR_NUMBER: ${{ needs.version-bump.outputs.pr_number }}
        run: |
          set -euo pipefail

          # Release notes come from the merged PR's "## Summary" section (the
          # user-curated version of the changes) rather than GitHub's
          # auto-generated PR-title list. Falls back to the PR title when the
          # section is empty or missing.
          PR_BODY="$(gh pr view "${PR_NUMBER}" --json body --jq '.body')"
          PR_TITLE="$(gh pr view "${PR_NUMBER}" --json title --jq '.title')"

          NOTES="$(PR_BODY="${PR_BODY}" node -e '
            const lines = String(process.env.PR_BODY ?? "").split(/\r?\n/);
            let collecting = false;
            const section = [];
            for (const line of lines) {
              const heading = line.match(/^#{1,6}\s*(.*)$/);
              if (heading) {
                if (collecting) break;
                if (/^summary$/i.test(heading[1].trim())) collecting = true;
                continue;
              }
              if (collecting) section.push(line);
            }
            // Drop the template hint comments, then trim the edges.
            process.stdout.write(section.join("\n").replace(/<!--[\s\S]*?-->/g, "").trim());
          ')"

          if [ -z "${NOTES}" ]; then
            echo "::notice::PR #${PR_NUMBER} has an empty Summary section; using its title as the release notes."
            NOTES="${PR_TITLE}"
          fi

          # Keep the compare link under the curated notes whenever a previous
          # release exists to link back to.
          NOTES_FILE="$(mktemp)"
          PREVIOUS_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name' || true)"
          if [ -n "${PREVIOUS_TAG}" ] && [ "${PREVIOUS_TAG}" != "v${RELEASE_VERSION}" ]; then
            printf '%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' \
              "${NOTES}" "${GITHUB_REPOSITORY}" "${PREVIOUS_TAG}" "${RELEASE_VERSION}" > "${NOTES_FILE}"
          else
            printf '%s\n' "${NOTES}" > "${NOTES_FILE}"
          fi

          echo "Release notes for v${RELEASE_VERSION}:"
          cat "${NOTES_FILE}"

          gh release create "v${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --notes-file "${NOTES_FILE}" \
            --verify-tag \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          rm -f "${NOTES_FILE}"

      - name: Attach updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version-bump.outputs.version }}
          GITHUB_REPOSITORY_PATH: ${{ github.repository }}
        run: |
          set -euo pipefail
          SIG="$(cat src-tauri/target/release/bundle/macos/*.app.tar.gz.sig)"
          # GitHub normalizes asset names on upload by replacing spaces with
          # dots; the manifest must reference the stored name or downloads 404.
          ASSET_NAME="$(basename src-tauri/target/release/bundle/macos/*.app.tar.gz | tr ' ' '.')"
          NOTES="$(gh release view "v${RELEASE_VERSION}" --json body --jq .body)"
          case "$(uname -m)" in
            arm64) PLATFORM="darwin-aarch64" ;;
            x86_64) PLATFORM="darwin-x86_64" ;;
            *) echo "Unsupported runner architecture"; exit 1 ;;
          esac
          export UPDATER_SIG="$SIG" UPDATER_ASSET_NAME="$ASSET_NAME" UPDATER_PLATFORM="$PLATFORM" UPDATER_NOTES="$NOTES"
          node -e '
            const fs = require("fs");
            const version = process.env.RELEASE_VERSION;
            const url =
              "https://github.com/" + process.env.GITHUB_REPOSITORY_PATH +
              "/releases/download/v" + version + "/" +
              encodeURIComponent(process.env.UPDATER_ASSET_NAME);
            const manifest = {
              version: version,
              notes: process.env.UPDATER_NOTES,
              pub_date: new Date().toISOString(),
              platforms: {
                [process.env.UPDATER_PLATFORM]: {
                  signature: process.env.UPDATER_SIG.trim(),
                  url: url,
                },
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          gh release upload "v${RELEASE_VERSION}" latest.json --clobber

          # Guard against a silently broken updater: the manifest URL must
          # match an asset actually stored on the release.
          STORED_ASSETS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}" --jq '.assets[].name')"
          if ! grep -Fxq "${ASSET_NAME}" <<<"${STORED_ASSETS}"; then
            echo "::error::latest.json references '${ASSET_NAME}' but the release assets are:"$'\n'"${STORED_ASSETS}"
            exit 1
          fi
          echo "Updater manifest verified: ${ASSET_NAME}"
