name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-bump:
    # Skip runs triggered by the bot's own release commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bump version, tag, and push
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export VERSION

          # Only release on merges of pull requests into main. The
          # commits-associated-with-PR endpoint serves a reduced PR object
          # with no "merged" field, so match on state and then verify the
          # merge against the canonical PR record.
          PR_NUMBER="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.state == "closed")][0].number' || true)"

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "::notice::Push ${GITHUB_SHA} is not an associated pull request; skipping release."
            echo "Skipped: not a merged pull request." >> "$GITHUB_STEP_SUMMARY"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IS_MERGED="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merged')"
          if [ "${IS_MERGED}" != "true" ]; then
            echo "::notice::PR #${PR_NUMBER} was closed without being merged; skipping release."
            echo "Skipped: PR #${PR_NUMBER} closed without merging." >> "$GITHUB_STEP_SUMMARY"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LABELS="$(gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name' || true)"
          if grep -qx 'major' <<<"${LABELS}"; then
            LEVEL=major
          elif grep -qx 'minor' <<<"${LABELS}"; then
            LEVEL=minor
          else
            LEVEL=patch
          fi
          echo "PR #${PR_NUMBER}: bumping ${LEVEL}"

          # Source of truth is package.json; any prerelease suffix is dropped.
          CURRENT="$(node -p 'require("./package.json").version')"
          BASE="${CURRENT%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<<"${BASE}"
          case "${LEVEL}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version ${CURRENT} -> ${VERSION}"

          # package.json + package-lock.json
          npm version "${VERSION}" --no-git-tag-version

          # tauri.conf.json
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          '

          # Cargo.toml ([package] section only)
          awk -v ver="${VERSION}" '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { $0 = "version = \"" ver "\"" }
            { print }
          ' src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
          mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml

          # Keep Cargo.lock in sync with the new crate version.
          (cd src-tauri && cargo update -w)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "refs/tags/v${VERSION}"

          {
            echo "released=true"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} from PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"

  build-and-release:
    needs: version-bump
    if: needs.version-bump.outputs.released == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.version-bump.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build macOS app bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version-bump.outputs.version }}" \
            --title "v${{ needs.version-bump.outputs.version }}" \
            --generate-notes \
            --verify-tag \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

      - name: Attach updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version-bump.outputs.version }}
          GITHUB_REPOSITORY_PATH: ${{ github.repository }}
        run: |
          set -euo pipefail
          SIG="$(cat src-tauri/target/release/bundle/macos/*.app.tar.gz.sig)"
          ASSET_NAME="$(basename src-tauri/target/release/bundle/macos/*.app.tar.gz)"
          NOTES="$(gh release view "v${RELEASE_VERSION}" --json body --jq .body)"
          case "$(uname -m)" in
            arm64) PLATFORM="darwin-aarch64" ;;
            x86_64) PLATFORM="darwin-x86_64" ;;
            *) echo "Unsupported runner architecture"; exit 1 ;;
          esac
          export UPDATER_SIG="$SIG" UPDATER_ASSET_NAME="$ASSET_NAME" UPDATER_PLATFORM="$PLATFORM" UPDATER_NOTES="$NOTES"
          node -e '
            const fs = require("fs");
            const version = process.env.RELEASE_VERSION;
            const url =
              "https://github.com/" + process.env.GITHUB_REPOSITORY_PATH +
              "/releases/download/v" + version + "/" +
              encodeURIComponent(process.env.UPDATER_ASSET_NAME);
            const manifest = {
              version: version,
              notes: process.env.UPDATER_NOTES,
              pub_date: new Date().toISOString(),
              platforms: {
                [process.env.UPDATER_PLATFORM]: {
                  signature: process.env.UPDATER_SIG.trim(),
                  url: url,
                },
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          gh release upload "v${RELEASE_VERSION}" latest.json --clobber
