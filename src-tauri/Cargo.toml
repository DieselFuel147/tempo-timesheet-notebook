[package]
name = "tempo_timesheet_tool"
version = "0.1.0"
description = "Tauri shell for the Tempo Timesheet Tool"
authors = ["Diesel Mitchell"]
edition = "2021"

[lib]
name = "tempo_timesheet_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
