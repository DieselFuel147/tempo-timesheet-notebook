[package]
name = "tempo_timesheet_tool"
version = "0.2.1"
description = "Tauri shell for the Tempo Timesheet Tool"
authors = ["Diesel Mitchell"]
edition = "2021"

[lib]
name = "tempo_timesheet_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
regex = "1"
reqwest = { version = "0.12", default-features = true, features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
uuid = { version = "1", features = ["v4"] }
